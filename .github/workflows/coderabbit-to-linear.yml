# Reusable workflow: post a @blocks comment on the Linear issue linked to a PR
# when CodeRabbit or Sourcery submits its review.
#
# Usage from any project repo:
#
#   jobs:
#     coderabbit-to-linear:
#       uses: timfong888/global-config/.github/workflows/coderabbit-to-linear.yml@main
#       secrets:
#         LINEAR_API: ${{ secrets.LINEAR_API }}
#
# Required secret in the calling repo:
#   LINEAR_API — a Linear personal API key with comment:create scope.
#   Generate one at: https://linear.app/settings/api  (Personal API keys)
#
# Required repository variable in global-config (already set):
#   BLOCKS_LINEAR_USER_ID — the Blocks agent's Linear user ID.
#   Manage at: github.com/timfong888/global-config/settings/variables/actions
#
# Branch-name convention (case-insensitive):
#   The workflow extracts the first token matching [A-Z]+-[0-9]+ from the PR
#   branch name, e.g. blocks/SAT-660-title → SAT-660.
#   Branches that carry no Linear identifier are silently skipped.
#
# Supported review bots:
#   - coderabbitai[bot]
#   - sourcery-ai[bot]

name: AI Review Bot → Linear

on:
  workflow_call:
    secrets:
      LINEAR_API:
        required: true

jobs:
  notify-linear:
    name: Post @blocks comment to Linear
    runs-on: ubuntu-latest
    # Only run when a known AI review bot posts a review.
    if: |
      github.event.review.user.login == 'coderabbitai[bot]' ||
      github.event.review.user.login == 'sourcery-ai[bot]'

    steps:
      - name: Check out global-config (for notify-linear.py)
        uses: actions/checkout@v4
        with:
          repository: timfong888/global-config
          ref: main

      - name: Extract Linear issue ID from branch name
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Match first token like SAT-660, BLO-123, etc. (case-insensitive)
          LINEAR_ID=$(echo "$BRANCH" | grep -oiE '[A-Za-z]+-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$LINEAR_ID" ]; then
            echo "No Linear issue ID found in branch: $BRANCH — skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Extracted Linear ID: $LINEAR_ID"
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "linear_id=$LINEAR_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Post @blocks comment to Linear
        if: steps.extract.outputs.found == 'true'
        env:
          LINEAR_API_KEY:        ${{ secrets.LINEAR_API }}
          LINEAR_ID:             ${{ steps.extract.outputs.linear_id }}
          PR_NUMBER:             ${{ github.event.pull_request.number }}
          PR_URL:                ${{ github.event.pull_request.html_url }}
          PR_TITLE:              ${{ github.event.pull_request.title }}
          REVIEW_URL:            ${{ github.event.review.html_url }}
          REVIEW_STATE:          ${{ github.event.review.state }}
          REVIEW_BODY:           ${{ github.event.review.body }}
          REVIEWER_LOGIN:        ${{ github.event.review.user.login }}
          REPO:                  ${{ github.repository }}
          BLOCKS_LINEAR_USER_ID: ${{ vars.BLOCKS_LINEAR_USER_ID }}
        run: python3 scripts/notify-linear.py
